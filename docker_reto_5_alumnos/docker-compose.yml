services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: creditos
      MYSQL_USER: clase
      MYSQL_PASSWORD: clase123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  cargar_datos:
    build: ./loader
    environment:
      DATABASE_URL: mysql+pymysql://clase:clase123@db:3306/creditos
      DATA_FILE: /datos/datos.xlsx
      FORCE_RELOAD: "false"
    volumes:
      - ./datos:/datos:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    environment:
      DATABASE_URL: mysql+pymysql://clase:clase123@db:3306/creditos
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      cargar_datos:
        condition: service_completed_successfully
    command: flask --app main run --host=0.0.0.0 --port=8000 --debug

volumes:
  mysql_data:
